<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <script src="/libs/nerdamer/nerdamer.core.js"></script>
        <script src="/libs/nerdamer/Algebra.js"></script>
        <script src="/libs/nerdamer/Calculus.js"></script>
        <script src="/libs/nerdamer/Solve.js"></script>
        <script src="/libs/nerdamer/Extra.js"></script>
        <script defer src="/libs/katex/katex.min.js"></script>
        <script defer src="/libs/katex/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
        <link rel="stylesheet" href="/libs/katex/katex.min.css">
        <title>lbdiffs</title>
    </head>
    <body>
        <h1>Графопостроитель интегральных кривых ОДУ (Численный/Графический)</h1>
        <hr>
        <h2>ВВОД</h2>
        <input type="text" id="formulaInput">
        <button id="formulaButton" disabled="true">РАССЧИТАТЬ</button>
        <hr>
        <h2>ВЫВОД</h2>
        <ul id="latex"></ul>
        <hr>
        <h2>ГРАФИК</h2>
        <div>
            <label for="scaleInput">Масштаб:</label>
            <input type="number" id="scaleInput" value="1.0" min="0.1" max="10" step="0.1" required>
            <h3>ИЗОКЛИНЫ</h3>
            <label for="isoclineStepInput">Шаг:</label>
            <input type="number" id="isoclineStepInput" value="0.5" min="0.01" max="5" step="0.01" required>
            <label for="isoclineInput">Отображаемая длина изоклин:</label>
            <input type="number" id="isoclineInput" value="0.25" min="0.1" max="2" step="0.1" required>
            <h3>РЕШЕНИЕ ЗАДАЧИ КОШИ</h3>
            <label for="rkStepInput">Шаг:</label>
            <input type="number" id="rkStepInput" value="0.05" min="0.001" max="5" step="0.001" required>
            <label for="sxInput">x0:</label>
            <input type="number" id="sxInput" value="0" required>
            <label for="syInput">y0:</label>
            <input type="number" id="syInput" value="0" required>
            <br>
            <button id="buildButton" disabled="true">Построить график</button>
        </div>
        <canvas id="chart" width="1200px" height="1200px" style="image-rendering: pixelated;"></canvas>
        <script src="render.js"></script>
        <script type="module" src="main.js"></script>
    </body>
</html>
